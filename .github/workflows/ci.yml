name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit, database and security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Pure functions only; this project runs without a web server.
      - run: npm run test:unit
      # Migrations, RLS and handlers against in-memory PostgreSQL (PGlite).
      - run: npm run test:db
      - run: npm run test:security

  browser:
    name: Build, secret scan and browser tests
    runs-on: ubuntu-latest
    env:
      # Placeholders: browser tests intercept every Supabase request.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm run build
      - run: npm run security:scan
      # Separate from test:unit: passing --project=calculos disables the web server.
      - run: npx playwright test --project=seguranca --project=desktop --project=celular
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
