name: Supabase migrations
on:
  pull_request:
    paths: ["supabase/migrations/**"]
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

permissions:
  contents: read

# Never run two pushes against the same database at once.
concurrency:
  group: supabase-migrations-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Nothing reaches the remote database unless the migrations pass locally.
      - run: npm run test:db
      - run: npm run test:security
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
      - name: Preview pending migrations
        run: supabase db push --dry-run
      - name: Apply pending migrations
        if: github.event_name != 'pull_request'
        run: supabase db push
